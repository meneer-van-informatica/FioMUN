name: Sync FioMUN public content

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: write

concurrency:
  group: fiomun-public-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public content
        env:
          FIOMUN_SITE_API: https://script.google.com/a/macros/fioretti.nl/s/AKfycbyigSMOBeepEjjcnwBEbvxC8_-YX1CYaDqXSsCh7w90M2z_XMm8BsmSgFwf2UoEkPR5/exec?api=site
        run: python3 scripts/sync_content.py
      - name: Commit public data changes
        run: |
          if git diff --quiet -- data/site-data.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json
          git commit -m "Refresh public FioMUN content"
          git push
